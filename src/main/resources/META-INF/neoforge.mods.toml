modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Cortex"
# Server streams LOD data only to clients that have the mod; the mod is optional on both sides.
displayTest="IGNORE_ALL_VERSION"
description='''
Far distance rendering mod utilising LoDs.
'''
logoFile="assets/voxy/icon.png"

[[mixins]]
config="common.voxy.mixins.json"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="iris.voxy.mixins.json"

[[mixins]]
config="fakesight.voxy.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sodium"
    type="required"
    versionRange="[0.8.12,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="[1.8.12,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="domum_ornamentum"
    type="optional"
    versionRange="[1.0,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="eclipticseasons_voxycompact"
    type="incompatible"
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
    reason="This voxy fork has EclipticSeasons seasonal-LOD support built in. Ecliptic Seasons: Voxy Compact targets the official voxy internal classes, which this fork no longer has - loading both crashes the game. Remove eclipticseasons_voxycompact."
