import groovy.json.JsonOutput

// Opt-in integrated-server lifecycle probe; excluded from ordinary builds.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir 'scripts/distant-gen-smoke/src'
        def control = sourceSets.create('disconnectControl') {
            java.srcDir 'scripts/distant-gen-smoke/control-src'
            resources.srcDir 'scripts/distant-gen-smoke/control-resources'
            compileClasspath = sourceSets.main.compileClasspath
        }
        def base = layout.buildDirectory.dir('reports/distant-gen-shutdown').get().asFile
        configurations.create('distantGenIris') { transitive = false }
        dependencies.add('distantGenIris', "maven.modrinth:iris:${iris_version}+${minecraft_version}-neoforge")
        tasks.register('writeDistantGenSmokeLaunch') {
            dependsOn 'classes', control.classesTaskName, 'neoFormJoined1.21.1-20240808.144430DownloadAssets',
                    'neoFormJoined1.21.1-20240808.144430ExtractNatives', 'writeMinecraftClasspathClient'
            doLast {
                def run = tasks.named('runClient').get()
                def controlClasspath = run.classpath.filter { !sourceSets.main.output.files.contains(it) } + control.output
                base.mkdirs()
                new File(base, 'launch.json').text = JsonOutput.toJson([
                        executable: run.javaLauncher.get().executablePath.asFile.absolutePath,
                        args: run.allJvmArgs + ['-cp', run.classpath.asPath, run.mainClass.get()] + run.args,
                        modClasses: run.environment['MOD_CLASSES'],
                        controlArgs: run.allJvmArgs + ['-cp', controlClasspath.asPath, run.mainClass.get()] + run.args,
                        controlModClasses: control.output.files.collect { 'disconnectControl%%' + it.absolutePath }.join(File.pathSeparator)])
                copy { from configurations.sodiumOuter.singleFile; into new File(base, 'mods') }
                copy { from configurations.distantGenIris.singleFile; into new File(base, 'mods') }
            }
        }
    }
}
