// Compatibility entry point; preferred: gradlew testJunit -PverifyGpu=true
allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        systemProperty 'voxy.verifyMeshGpu', 'true'
        systemProperty 'voxy.verifyScreenspaceGpu', 'true'
        systemProperty 'voxy.verifyTerrainGpu', 'true'
    }
}
