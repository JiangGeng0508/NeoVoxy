//file:noinspection GroovyAssignabilityCheck
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.caffeinemc.net/releases' }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

jar {
    // jarJar embeds this project's jar, so it always depends on `jar`. Copying the full
    // jar-in-jar output over the plain jar output must therefore happen *after* jarJar
    // (as a finalizer); wiring it as a jar -> jarJar dependency creates a circular task
    // graph and breaks every build.
    finalizedBy tasks.named('jarJar')
}

tasks.named('jarJar') {
    archiveClassifier = 'bundled'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies {
            runtime 'org.lwjgl:lwjgl-lmdb'
            runtime 'org.lwjgl:lwjgl-zstd'
            runtime 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
            runtime 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
            runtime 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
            runtime 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'
            runtime 'org.rocksdb:rocksdbjni:10.2.1'
            runtime 'at.yawk.lz4:lz4-java:1.10.1'
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
}

configurations {
    configureEach {
        exclude group: 'org.lz4', module: 'lz4-java'
        resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
            select('at.yawk.lz4:lz4-java:1.10.1')
            because 'Voxy uses the maintained at.yawk lz4-java artifact instead of the legacy org.lz4 module.'
        }
    }
    runtimeClasspath.extendsFrom localRuntime
    sodiumOuter
    prunedRocksDB
}

def sodiumNeoForgeModJar = layout.buildDirectory.file('extracted/sodium-neoforge-mod.jar')

def extractSodiumNeoForgeModJar = tasks.register('extractSodiumNeoForgeModJar', Copy) {
    from({ zipTree(configurations.sodiumOuter.singleFile) }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.12+mc1.21.1-mod.jar'
        eachFile { details ->
            details.path = 'sodium-neoforge-mod.jar'
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted')
}

def prunedLibraryDir = layout.buildDirectory.dir('pruned-libs')

tasks.register('makePrunedRocksDBJar', Zip) {
    group = 'build'
    description = 'Removes non-desktop RocksDB native libraries from the JarJar dependency.'
    dependsOn configurations.prunedRocksDB

    archiveFileName.set('rocksdbjni-10.2.1.jar')
    destinationDirectory.set(prunedLibraryDir)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from { zipTree(configurations.prunedRocksDB.singleFile) }

    exclude { details ->
        def file = details.name
        if (file.endsWith('.jnilib') || file.endsWith('.dylib')) {
            return true
        }
        if (!file.endsWith('.so')) {
            return false
        }
        return ['linux32', 'musl', 's390x', 'riscv64', 'ppc64le', 'aarch64'].any { file.contains(it) }
    }
}

def replaceZipEntries = { File jarFile, Map<String, File> replacements ->
    def tempFile = new File(jarFile.parentFile, "${jarFile.name}.tmp")
    def buffer = new byte[8192]
    def seen = [] as Set

    new ZipInputStream(new BufferedInputStream(new FileInputStream(jarFile))).withCloseable { zin ->
        new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempFile))).withCloseable { zout ->
            ZipEntry entry
            while ((entry = zin.nextEntry) != null) {
                def replacement = replacements[entry.name]
                def outEntry = new ZipEntry(entry.name)
                outEntry.time = entry.time
                zout.putNextEntry(outEntry)

                if (replacement != null) {
                    replacement.withInputStream { input -> input.transferTo(zout) }
                    seen.add(entry.name)
                } else if (!entry.directory) {
                    int read
                    while ((read = zin.read(buffer)) > 0) {
                        zout.write(buffer, 0, read)
                    }
                }

                zout.closeEntry()
                zin.closeEntry()
            }
        }
    }

    def missing = replacements.keySet() - seen
    if (!missing.isEmpty()) {
        tempFile.delete()
        throw new GradleException("JarJar entries not found for pruning: ${missing}")
    }
    if (!jarFile.delete()) {
        tempFile.delete()
        throw new GradleException("Could not replace ${jarFile}")
    }
    if (!tempFile.renameTo(jarFile)) {
        throw new GradleException("Could not move ${tempFile} to ${jarFile}")
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('makePrunedRocksDBJar')
    inputs.files(tasks.named('makePrunedRocksDBJar').flatMap { it.archiveFile })

    doLast {
        replaceZipEntries(archiveFile.get().asFile, [
                'META-INF/jarjar/rocksdbjni-10.2.1.jar' : tasks.named('makePrunedRocksDBJar').get().archiveFile.get().asFile
        ])
    }

    // Leave the complete (jar-in-jar) mod under the standard file name so the
    // `gradlew jar` / `gradlew build` outputs are directly usable.
    doLast {
        def out = tasks.named('jar').get().archiveFile.get().asFile
        def full = archiveFile.get().asFile
        if (full.exists() && full != out) {
            Files.copy(full.toPath(), out.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

dependencies {
    modules {
        module('org.lz4:lz4-java') {
            replacedBy('at.yawk.lz4:lz4-java', 'Voxy uses the maintained at.yawk lz4-java artifact.')
        }
    }

    implementation("net.neoforged:neoforge:${neo_version}") {
        exclude group: 'org.lz4', module: 'lz4-java'
    }

    sodiumOuter "maven.modrinth:sodium:mc1.21.1-0.8.12-neoforge"
    compileOnly files(sodiumNeoForgeModJar).builtBy(extractSodiumNeoForgeModJar)
    localRuntime "maven.modrinth:sodium:mc1.21.1-0.8.12-neoforge"
    compileOnly "maven.modrinth:iris:1.8.0+1.21.1-neoforge"
    compileOnly "maven.modrinth:fALzjamp:LuFhm4eU"

    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-lmdb'
    implementation 'org.lwjgl:lwjgl-zstd'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'

    implementation 'redis.clients:jedis:5.1.0'
    implementation 'org.rocksdb:rocksdbjni:10.2.1'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    prunedRocksDB 'org.rocksdb:rocksdbjni:10.2.1'

    jarJar 'org.rocksdb:rocksdbjni:10.2.1'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.deprecation = true
}
