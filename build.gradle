//file:noinspection GroovyAssignabilityCheck
import java.util.zip.ZipEntry
import java.util.zip.ZipInputStream
import java.util.zip.ZipOutputStream

//file:noinspection GroovyAssignabilityCheck
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.caffeinemc.net/releases' }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

// jarJar's output (mod classes + nested dependency jars) is only an input to slimJar. Keep that
// intermediate out of build/libs so it cannot be published by mistake; the distributable is the
// trimmed archive slimJar writes back under the standard file name.
jar {
    destinationDirectory.set(layout.buildDirectory.dir('intermediate-jars'))
}

tasks.named('jarJar') {
    archiveClassifier = 'bundled'
    destinationDirectory.set(layout.buildDirectory.dir('intermediate-jars'))
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        dependencies {
            runtime 'org.lwjgl:lwjgl-lmdb'
            runtime 'org.lwjgl:lwjgl-zstd'
            runtime 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
            runtime 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
            runtime 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
            runtime 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'
            runtime 'org.rocksdb:rocksdbjni:10.2.1'
            runtime 'at.yawk.lz4:lz4-java:1.10.1'
            runtime 'org.tukaani:xz:1.10'
            runtime 'org.xerial:sqlite-jdbc:3.49.1.0'
            runtime 'redis.clients:jedis:5.1.0'
            runtime 'org.apache.commons:commons-pool2:2.12.0'
        }
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    junit {
        unitTestSource project.sourceSets.test
    }
}

configurations {
    configureEach {
        exclude group: 'org.lz4', module: 'lz4-java'
        resolutionStrategy.capabilitiesResolution.withCapability('org.lz4:lz4-java') {
            select('at.yawk.lz4:lz4-java:1.10.1')
            because 'Voxy uses the maintained at.yawk lz4-java artifact instead of the legacy org.lz4 module.'
        }
    }
    runtimeClasspath.extendsFrom localRuntime
    sodiumOuter
    createOuter
    sableOuter
    lwjglNativesRaw
}

def sodiumNeoForgeModJar = layout.buildDirectory.file('extracted/sodium-neoforge-mod.jar')

def extractSodiumNeoForgeModJar = tasks.register('extractSodiumNeoForgeModJar', Copy) {
    from({ zipTree(configurations.sodiumOuter.singleFile) }) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.12+mc1.21.1-mod.jar'
        eachFile { details ->
            details.path = 'sodium-neoforge-mod.jar'
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted')
}

// Sodium's bootstrap service must be discovered from mods/ before the early window.
// Putting its outer LIBRARY JAR on userdev's classpath makes JarJar mistake it for
// the actual nested Sodium mod. Install the original distribution for client runs,
// preserving any Sodium version the developer has already installed.
tasks.withType(JavaExec).configureEach {
    if (name == 'runClient') {
        doFirst {
            File modsDirectory = new File(workingDir, 'mods')
            boolean installed = modsDirectory.listFiles()?.any { File file ->
                if (!file.name.endsWith('.jar')) return false
                try {
                    return new java.util.zip.ZipFile(file).withCloseable { archive ->
                        def descriptor = archive.getEntry('META-INF/neoforge.mods.toml')
                        if (descriptor == null) return false
                        String metadata = archive.getInputStream(descriptor).withCloseable { it.getText('UTF-8') }
                        // Dependency tables can also mention sodium (for example Sable's
                        // optional compatibility). Only an actual [[mods]] entry counts.
                        def modTables = metadata =~ /(?ms)^\h*\[\[mods\]\]\h*(?:#[^\r\n]*)?\R(.*?)(?=^\h*\[|\z)/
                        return modTables.any { table ->
                            (table[1] =~ /(?m)^\h*modId\h*=\h*["']sodium["']/).find()
                        }
                    }
                } catch (java.util.zip.ZipException ignored) {
                    return false
                }
            } ?: false
            if (!installed) {
                project.copy {
                    from configurations.sodiumOuter.singleFile
                    into modsDirectory
                }
            }
        }
    }
}

// Create ships its Ponder and Flywheel compile APIs as nested jarjar jars. Extract the exact
// nested artifacts so the optional Create integration can be compiled against a version-matched
// API without hand-maintained libs/ files.
def createPonderJar = layout.buildDirectory.file('extracted/create/ponder-neoforge-1.0.82+mc1.21.1.jar')
def createFlywheelJar = layout.buildDirectory.file('extracted/create/flywheel-neoforge-1.21.1-1.0.6.jar')

def extractCreateCompileJars = tasks.register('extractCreateCompileJars', Copy) {
    from({ zipTree(configurations.createOuter.singleFile) }) {
        include 'META-INF/jarjar/ponder-neoforge-1.0.82+mc1.21.1.jar'
        include 'META-INF/jarjar/flywheel-neoforge-1.21.1-1.0.6.jar'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted/create')
}

// Sable likewise ships its companion API and generated Rapier implementation as nested jars.
def sableCompanionJar = layout.buildDirectory.file('extracted/sable/sable-companion-common-1.21.1-1.6.0.jar')
def sableRapierJar = layout.buildDirectory.file('extracted/sable/dev.ryanhcode.sable.sable-sable_rapier-1.21.1-2.0.5.jar')

def extractSableCompileJars = tasks.register('extractSableCompileJars', Copy) {
    from({ zipTree(configurations.sableOuter.singleFile) }) {
        include 'META-INF/jarjar/sable-companion-common-1.21.1-1.6.0.jar'
        include 'META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-1.21.1-2.0.5.jar'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('extracted/sable')
}

// Voxy needs the LWJGL ZSTD/LMDB classes *and* their native binaries. Minecraft/NeoForge ship
// neither, and JarJar can only embed one archive per Maven coordinate, so follow the neo-voxy
// layout: the class jars go into the jar-in-jar bundle (slimJar strips their Java-9 module
// descriptors) while the native binaries are flattened into the root of the distributable JAR,
// where LWJGL's SharedLibraryLoader looks for them.
def extractedNativesDir = layout.buildDirectory.dir('extracted-natives')

tasks.register('extractLwjglNatives') {
    group = 'build'
    description = 'Extracts the LWJGL native binaries Voxy needs (Windows/Linux x86_64).'
    inputs.files(configurations.lwjglNativesRaw)
    outputs.dir(extractedNativesDir)

    doLast {
        def outputDir = extractedNativesDir.get().asFile
        delete(outputDir)
        outputDir.mkdirs()
        configurations.lwjglNativesRaw.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            logger.lifecycle("Extracting natives from ${artifact.file.name}")
            copy {
                from(zipTree(artifact.file)) {
                    include '**/*.dll'
                    include '**/*.so'
                    include '**/*.dylib'
                    // Flatten: LWJGL looks the binaries up at the classpath root.
                    eachFile { fcp -> fcp.relativePath = new RelativePath(true, fcp.name) }
                    includeEmptyDirs = false
                }
                into outputDir
            }
        }
    }
}

tasks.named('jarJar') {
    dependsOn tasks.named('extractLwjglNatives')
    from(extractedNativesDir) {
        // Natives at the JAR root, where LWJGL's SharedLibraryLoader finds them.
        into ''
    }
}

// The distributable: jarJar's output with native libraries that cannot run on the two supported
// desktop targets trimmed, the LWJGL module descriptors removed (on a dedicated server those
// descriptors require the client-only org.lwjgl module before FML can start) and every nested
// jarjar archive left STORED so NeoForge's jarjar loader can random-access it.
def slimJarOutput = layout.buildDirectory.file(
        "libs/${tasks.named('jar').get().archiveFileName.get()}")

tasks.register('slimJar') {
    group = 'build'
    description = 'Creates the trimmed Windows/Linux distributable JAR without external tools'
    dependsOn tasks.named('jarJar')

    def sourceJar = tasks.named('jarJar').flatMap { it.archiveFile }
    inputs.file(sourceJar)
    outputs.file(slimJarOutput)

    doLast {
        def source = sourceJar.get().asFile
        def target = slimJarOutput.get().asFile
        target.parentFile.mkdirs()

        def putEntry
        putEntry = { ZipOutputStream output, String name, byte[] data, int requestedMethod, long timestamp ->
            def entry = new ZipEntry(name)
            if (timestamp >= 0L) entry.time = timestamp
            int method = requestedMethod == ZipEntry.STORED ? ZipEntry.STORED : ZipEntry.DEFLATED
            entry.method = method
            if (method == ZipEntry.STORED) {
                def crc = new java.util.zip.CRC32()
                crc.update(data)
                entry.size = data.length
                entry.compressedSize = data.length
                entry.crc = crc.value
            }
            output.putNextEntry(entry)
            if (data.length != 0) output.write(data)
            output.closeEntry()
        }

        def rewriteNested = { byte[] inputBytes, Closure<Boolean> shouldDrop, String label ->
            def bytesOut = new ByteArrayOutputStream(inputBytes.length)
            int removed = 0
            new ZipInputStream(new ByteArrayInputStream(inputBytes)).withCloseable { input ->
                new ZipOutputStream(bytesOut).withCloseable { output ->
                    ZipEntry entry
                    while ((entry = input.nextEntry) != null) {
                        byte[] data = entry.directory ? new byte[0] : input.readAllBytes()
                        if (shouldDrop.call(entry.name)) {
                            removed++
                        } else {
                            putEntry(output, entry.name, data, entry.method, entry.time)
                        }
                        input.closeEntry()
                    }
                }
            }
            logger.lifecycle("  ${label}: removed ${removed} unused entries")
            return bytesOut.toByteArray()
        }

        boolean foundRocks = false
        boolean foundSqlite = false
        int foundLwjgl = 0
        def rocksKeep = ['librocksdbjni-win64.dll', 'librocksdbjni-linux64.so'] as Set
        def sqliteKeep = ['org/sqlite/native/Windows/x86_64/', 'org/sqlite/native/Linux/x86_64/']

        if (target.exists() && !target.delete()) {
            throw new GradleException("Could not replace ${target}")
        }

        new java.util.zip.ZipFile(source).withCloseable { input ->
            new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(target))).withCloseable { output ->
                def entries = input.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    byte[] data = entry.directory ? new byte[0] : input.getInputStream(entry).withCloseable { it.readAllBytes() }
                    String name = entry.name

                    if (name.startsWith('META-INF/jarjar/rocksdbjni-') && name.endsWith('.jar')) {
                        foundRocks = true
                        data = rewriteNested(data, { String nestedName ->
                            String baseName = nestedName.substring(nestedName.lastIndexOf('/') + 1)
                            boolean nativeFile = baseName.startsWith('librocksdbjni-') &&
                                    (baseName.endsWith('.so') || baseName.endsWith('.dll') || baseName.endsWith('.jnilib'))
                            return nativeFile && !rocksKeep.contains(baseName)
                        }, 'rocksdbjni')
                    } else if (name.startsWith('META-INF/jarjar/sqlite-jdbc-') && name.endsWith('.jar')) {
                        foundSqlite = true
                        data = rewriteNested(data, { String nestedName ->
                            if (!nestedName.startsWith('org/sqlite/native/') || nestedName.endsWith('/')) return false
                            return !sqliteKeep.any { nestedName.startsWith(it) }
                        }, 'sqlite-jdbc')
                    } else if ((name.startsWith('META-INF/jarjar/lwjgl-zstd-') ||
                                name.startsWith('META-INF/jarjar/lwjgl-lmdb-')) && name.endsWith('.jar')) {
                        foundLwjgl++
                        data = rewriteNested(data, { String nestedName ->
                            nestedName == 'META-INF/versions/9/module-info.class'
                        }, name.substring(name.lastIndexOf('/') + 1))
                    }

                    // Nested archives must stay STORED so NeoForge's jarjar loader can random-access them.
                    int method = name.startsWith('META-INF/jarjar/') && name.endsWith('.jar')
                            ? ZipEntry.STORED : entry.method
                    putEntry(output, name, data, method, entry.time)
                }
            }
        }

        if (!foundRocks || !foundSqlite || foundLwjgl != 2) {
            target.delete()
            throw new GradleException("Expected nested dependencies were not found " +
                    "(rocksdb=${foundRocks}, sqlite=${foundSqlite}, lwjgl=${foundLwjgl}/2)")
        }
        logger.lifecycle(String.format(Locale.ROOT, 'Slim JAR: %.1f MB -> %.1f MB',
                source.length() / 1048576.0d, target.length() / 1048576.0d))
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('slimJar')
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    modules {
        module('org.lz4:lz4-java') {
            replacedBy('at.yawk.lz4:lz4-java', 'Voxy uses the maintained at.yawk lz4-java artifact.')
        }
    }

    implementation("net.neoforged:neoforge:${neo_version}") {
        exclude group: 'org.lz4', module: 'lz4-java'
    }

    sodiumOuter "maven.modrinth:sodium:mc1.21.1-0.8.12-neoforge"
    compileOnly files(sodiumNeoForgeModJar).builtBy(extractSodiumNeoForgeModJar)
    compileOnly "maven.modrinth:iris:1.8.0+1.21.1-neoforge"
    compileOnly "maven.modrinth:fALzjamp:LuFhm4eU"

    // === Optional mod integration compile-time APIs (all optional at runtime) ===
    createOuter "maven.modrinth:create:6.0.10+mc1.21.1"
    compileOnly "maven.modrinth:create:6.0.10+mc1.21.1"
    compileOnly files(createPonderJar, createFlywheelJar).builtBy(extractCreateCompileJars)

    sableOuter "maven.modrinth:sable:2.0.5+mc1.21.1"
    compileOnly "maven.modrinth:sable:2.0.5+mc1.21.1"
    compileOnly files(sableCompanionJar, sableRapierJar).builtBy(extractSableCompileJars)

    compileOnly "maven.modrinth:ecliptic-seasons:0.15.0-rc-3-1"
    compileOnly "maven.modrinth:lithium:mc1.21.1-0.15.1-neoforge"
    compileOnly "maven.modrinth:create-bits-n-bobs:2.1.11-beta"
    compileOnly "maven.modrinth:azimuth-api:1.4.1"
    compileOnly "maven.modrinth:entityculling:1.10.5"
    compileOnly "maven.modrinth:sodium-options-api:neoforge-1.21.1-1.0.10"
    compileOnly "maven.modrinth:reeses-sodium-options:mc1.21.3-1.8.0+neoforge"

    implementation platform('org.lwjgl:lwjgl-bom:3.3.3')
    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-lmdb'
    implementation 'org.lwjgl:lwjgl-zstd'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'

    implementation 'redis.clients:jedis:5.1.0'
    implementation 'org.rocksdb:rocksdbjni:10.2.1'
    implementation 'org.apache.commons:commons-pool2:2.12.0'
    implementation 'at.yawk.lz4:lz4-java:1.10.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    //Native binaries repackaged into the distributable JAR root by extractLwjglNatives.
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:3.3.3:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:3.3.3:natives-windows"
    lwjglNativesRaw "org.lwjgl:lwjgl-zstd:3.3.3:natives-linux"
    lwjglNativesRaw "org.lwjgl:lwjgl-lmdb:3.3.3:natives-linux"

    //Runtime libraries the shipped JAR must provide: the default section storage is RocksDB + ZSTD,
    //LMDB and Redis are selectable backends, and xz/sqlite power the Distant Horizons import.
    //(LZ4 is deliberately NOT bundled - Minecraft ships org.lz4:lz4-java itself.)
    jarJar 'org.rocksdb:rocksdbjni:10.2.1'
    jarJar 'org.lwjgl:lwjgl-zstd:3.3.3'
    jarJar 'org.lwjgl:lwjgl-lmdb:3.3.3'
    jarJar 'redis.clients:jedis:5.1.0'
    jarJar 'org.apache.commons:commons-pool2:2.12.0'
    jarJar 'org.tukaani:xz:1.10'
    jarJar 'org.xerial:sqlite-jdbc:3.49.1.0'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.deprecation = true
}

// Minecraft and mod classes need NeoForge's transforming classloader (testJunit).
tasks.named('test') {
    dependsOn 'testJunit'
    enabled = false
}
